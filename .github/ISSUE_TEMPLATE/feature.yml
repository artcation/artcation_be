name: 기능 개발
description: 새로운 기능이나 API 개발 작업을 등록합니다
title: "[Feat] "
labels: ["feature"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 작업 개요
      description: 어떤 기능을 개발하는지 한두 문장으로 설명해 주세요.
      placeholder: 카카오 소셜 로그인 API를 추가합니다.
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: 배경 / 필요성
      description: 이 기능이 왜 필요한지 작성해 주세요.
    validations:
      required: false

  - type: textarea
    id: todo
    attributes:
      label: 작업 항목
      description: 세부 작업을 체크리스트로 나눠 주세요.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: etc
    attributes:
      label: 참고 사항
      description: 참고 링크, 관련 이슈, 스펙 문서 등을 남겨 주세요.
    validations:
      required: false
